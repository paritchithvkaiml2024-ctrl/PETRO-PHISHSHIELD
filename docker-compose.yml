version: '3.8'

services:
  app:
    build: .
    container_name: petro-phish-platform
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TIMESCALE_HOST=timescaledb
      - TIMESCALE_PORT=5432
      - REDIS_FEAST_HOST=redis
    depends_on:
      - kafka
      - timescaledb
      - redis
    restart: unless-stopped

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: petro-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: petro-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: petro-timescaledb
    environment:
      POSTGRES_USER: petro_admin
      POSTGRES_PASSWORD: petro_secure_password_2026
      POSTGRES_DB: refinery_telemetry
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: feast-redis-online-store
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: petro-prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: petro-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
